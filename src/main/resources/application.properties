spring.application.name=spring_rest
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/xe
spring.datasource.username=system
spring.datasource.password=Awsys123

# Reduce logging level. Only warn is displayed
logging.level.root=warn

# Turn off Spring Boot Banner
spring.main.banner-mode=off

# Add logging configs to displayed SQL statements
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace

# Configure JCA/Hibernate to auto update the tables
spring.jpa.hibernate.ddl-auto=update